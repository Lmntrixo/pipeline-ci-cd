name: CD sans kybernetes

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verifier aue app.js existe et est valide
        run: node --check app.js

  build-and-push:
    needs: test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Build and push
        run: |
          docker build -t evanslmntrix/mon-app:${{ github.sha }} .
          docker push evanslmntrix/mon-app:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: deployer sur kubernetes( kind)
        run: kubectl set image deployment/mon-app mon-app=evanslmntrix/mon-app:${{ github.sha }}

      - name: Stop ancien container si existe
        run: docker rm -f mon-appli || true

      - name: Lancer le nouveau container
        run: docker run -d -p 3000:3000 --name mon-appli mon-app:${{ github.sha }}
