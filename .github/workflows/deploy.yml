name: CD sans kybernetes

on:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verifier que app.js existe et est bien valide
        run: node --check app.js

  deploy:
    needs: test
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t mon-app:${{ github.sha }} .

      - name: Stop ancien container si existant
        run: docker rm -f mon-app || true

      - name: lancer le nouveau container
        run: docker run -d -p 3000:3000 --name mon-app mon-app:${{ github.sha }}



